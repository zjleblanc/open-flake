services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: openflake-postgres
    ports:
      - "5432:5432"
    command: ["postgres", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
    environment:
      POSTGRES_USER: openflake
      POSTGRES_PASSWORD: openflake
      POSTGRES_DB: openflake
    volumes:
      - openflake-pg-data:/var/lib/postgresql/data
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    networks:
      - openflake-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openflake -d openflake"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: deploy/Containerfile.backend
    container_name: openflake-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://openflake:openflake@postgres:5432/openflake
      SECRET_KEY: change-me-in-production
      BASE_URL: http://localhost:8000
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin
      ATTACHMENTS_PATH: /data/attachments
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - ${OPENFLAKE_ATTACHMENTS_MOUNT:-openflake-attachments:/data/attachments}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - openflake-net
    healthcheck:
      test: ["CMD", "/app/backend-healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ..
      dockerfile: deploy/Containerfile.frontend
    container_name: openflake-frontend
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - openflake-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  openflake-net:
    driver: bridge

volumes:
  openflake-pg-data:
  openflake-attachments:
