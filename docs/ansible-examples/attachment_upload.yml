---
- name: OpenFlake attachment upload smoke test
  hosts: localhost
  gather_facts: false
  vars:
    openflake_host: "{{ lookup('env', 'SN_HOST') | default('http://localhost:8000', true) }}"
    openflake_user: "{{ lookup('env', 'SN_USERNAME') | default('admin', true) }}"
    openflake_pass: "{{ lookup('env', 'SN_PASSWORD') | default('admin', true) }}"
  tasks:
    - name: Create incident for attachment
      servicenow.itsm.incident:
        instance:
          host: "{{ openflake_host }}"
          username: "{{ openflake_user }}"
          password: "{{ openflake_pass }}"
        state: new
        short_description: "Attachment test incident"
      register: incident

    - name: Upload attachment
      servicenow.itsm.attachment_upload:
        instance:
          host: "{{ openflake_host }}"
          username: "{{ openflake_user }}"
          password: "{{ openflake_pass }}"
        table_name: incident
        table_sys_id: "{{ incident.record.sys_id }}"
        attachments:
          - name: sample-attachment
            path: "{{ playbook_dir }}/sample-attachment.txt"
      register: attachment

    - name: Assert attachment uploaded
      ansible.builtin.assert:
        that:
          - attachment.records | length >= 1
          - attachment.records[0].sys_id is defined
