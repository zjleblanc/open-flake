---
- name: OpenFlake configuration item smoke test
  hosts: localhost
  gather_facts: false
  vars:
    openflake_host: "{{ lookup('env', 'SN_HOST') | default('http://localhost:8000', true) }}"
    openflake_user: "{{ lookup('env', 'SN_USERNAME') | default('admin', true) }}"
    openflake_pass: "{{ lookup('env', 'SN_PASSWORD') | default('admin', true) }}"
  tasks:
    - name: Create configuration item
      servicenow.itsm.configuration_item:
        instance:
          host: "{{ openflake_host }}"
          username: "{{ openflake_user }}"
          password: "{{ openflake_pass }}"
        sys_class_name: cmdb_ci_server
        name: "ansible-test-server"
        short_description: "Created by Ansible smoke test"
        install_status: installed
        operational_status: operational
      register: ci_result

    - name: Assert CI created
      ansible.builtin.assert:
        that:
          - ci_result.record.name == "ansible-test-server"
          - ci_result.record.sys_class_name == "cmdb_ci_server"
