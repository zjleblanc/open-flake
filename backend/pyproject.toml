[project]
name = "openflake-backend"
version = "0.1.0"
description = "OpenFlake ITSM backend — ServiceNow-compatible API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "bcrypt>=4.0.0",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "debugpy>=1.8.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
openflake-seed-lab = "app.seed.lab:main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["app.seed*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 99
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "W",      # pycodestyle warnings
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "S",      # flake8-bandit
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific
]
# No blanket `ignore = [...]` here -- every suppression below is scoped to the
# specific file(s) where it is justified. See AGENTS.md for the reasoning.

[tool.ruff.lint.per-file-ignores]
# Patterns are prefixed with "**/" so they match regardless of whether ruff is
# invoked with a cwd of `backend/` (path like `app/api/...`) or the repo root,
# as pre-commit does (path like `backend/app/api/...`).
"**/app/api/**" = ["B008"] # FastAPI Depends()/Query() in defaults is idiomatic
"**/app/auth/deps.py" = ["B008", "SIM102"] # Depends() defaults + nested auth guards read clearer un-merged
"**/app/api/flake/catalog_admin.py" = ["SIM102"] # nested if permission guards read clearer un-merged
"**/app/auth/rbac.py" = ["SIM102"] # nested if permission guards read clearer un-merged
"**/app/domain/table_service.py" = ["E501", "SIM108"] # long URL template; ternary reads worse here
"**/app/seed/lab.py" = ["E501", "S105"] # long seed-data strings; LAB_USER_PASSWORD is throwaway demo data
"**/app/config.py" = ["S105"] # documented default/dev-only secret_key, not a real secret
"**/app/startup.py" = ["S106"] # client_secret kwarg name false-positives as hardcoded password
"**/tests/**" = [
    "S101",   # assert is fine in tests
    "B023",   # closures over loop vars are intentional in test mocks
    "S106",   # hardcoded password args are test fixtures, not real secrets
    "S108",   # /tmp paths are fine in isolated test fixtures
    "SIM117", # nested `with` blocks are common and readable in tests
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
